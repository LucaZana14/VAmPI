name: Secret Scanning - GitLeaks

on:
  workflow_call

permissions:
  contents: read

jobs:
  gitleaks:
    name: GitLeaks Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2 
        with:
          egress-policy: audit

      - name: Checkout del codice
        uses: actions/checkout@v6 
        with:
          fetch-depth: 0

      - name: Installa gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Esegui gitleaks su tutta la repo
        run: |
          gitleaks detect \
            --source . \
            --report-format sarif \
            --report-path results.sarif \
            --redact \
            --exit-code 0 \
            --verbose

      - name: Debug — quanti leak trovati
        if: always()
        run: |
          if [ -f results.sarif ]; then
            python3 -c "import json; d=json.load(open('results.sarif')); print('Leak trovati:', sum(len(r['results']) for r in d['runs']))"
          else
            echo "results.sarif non generato!"
            exit 1
          fi

      - name: Carica i risultati su GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif