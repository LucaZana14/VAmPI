name: Master Security Pipeline

on:
    push:
        branches: [ "main", "master" ]
    pull_request:
        branches: [ "main", "master" ]

permissions:
    contents: read
    security-events: write
concurrency:
    group: ${{ github.workflow }}-${{github.ref}}
    cancel-in-progress: true

jobs:

    gitleaks:
        name: run gitLeaks
        uses: ./.github/workflows/gitLeaks.yml

    spectral: 
        name: run Spectral
        uses: ./.github/workflows/spectral.yml 
