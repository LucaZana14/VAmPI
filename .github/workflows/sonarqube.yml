name: SonarQube Quality Scan

on:
  workflow_call

jobs:
  sonar-scan:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Necessario per caricare il SARIF alla fine
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Cruciale per SonarQube

      - name: Esegui scansione SonarQube
        # Se usi SonarCloud (la versione cloud gratuita per le repo pubbliche), 
        # questo step farà tutto da solo con i token.
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.organization=lucazana14
            -Dsonar.projectKey=lucazana14_VAmPI

        
      - name: Convert SonarCloud issues to SARIF
        if: always()
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_ORG: ${{ secrets.SONAR_ORG }}
            SONAR_PROJECT: ${{secrets.SONAR_PROJECT_KEY}}
        run: |
            python3 .github/scripts/sonar_to_sarif.py

            
      - name: Carica i risultati su GitHub Security
        uses: github/codeql-action/upload-sarif@v4 
        if: always()
        with:
          sarif_file: sonarcloud.sarif