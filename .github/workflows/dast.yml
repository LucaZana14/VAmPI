name: Dynamic Security Testing

on:
  workflow_call

jobs:
  zap-scan:
    name: OWASP ZAP API Scan
    runs-on: ubuntu-latest
    
    # PERMESSI CRITICI: Servono a GitHub per accettare il file SARIF e scrivere i ticket
    permissions:
      issues: write
      contents: read
      security-events: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Accendiamo VAmPI all'interno del server GitHub
      - name: Build e Avvio di VAmPI
        run: |
          docker compose up --build -d
          sleep 15 

      # 2. Scateniamo ZAP abilitando la generazione del file SARIF
      - name: Esegui scansione OWASP ZAP
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'http://localhost:5050/openapi.json'
          format: 'openapi'
          fail_action: false
          # Chiediamo esplicitamente a ZAP di generare il file SARIF nella cartella di lavoro
          cmd_options: '-r zap_report.html -z "-addoninstall sarif" -J zap_report.json'

      # 3. Carichiamo i risultati SARIF nella tab Security di GitHub
      - name: Upload dei risultati DAST su GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() # Carica i risultati anche se ZAP ha trovato delle vulnerabilità
        with:
          # L'Action di ZAP genera automaticamente un file chiamato 'results.sarif' nella root
          sarif_file: 'results.sarif'
          category: 'owasp-zap-dast'

      # 4. Mantieni comunque il report HTML come backup scaricabile (opzionale ma comodo)
      - name: Salva il Report HTML di backup
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-html-report
          path: report_html.html