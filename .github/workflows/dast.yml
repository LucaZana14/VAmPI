name: Dynamic Security Testing

on:
  workflow_call

jobs:
  zap-scan:
    name: OWASP ZAP API Scan
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      contents: read
      security-events: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Accendiamo VAmPI all'interno del server GitHub
      - name: Build e Avvio di VAmPI
        run: |
          docker compose up --build -d
          sleep 15 

      # 2. Creiamo al volo il file di configurazione ufficiale di ZAP (Automation Framework)
      # Questo dice a ZAP in modo inequivocabile di generare il formato 'sarif' nominato 'results'
      - name: Creazione configurazione ZAP Automation
        run: |
          cat << 'EOF' > vampi-zap.yaml
          env:
            target: "http://localhost:5050"
            contexts:
              - name: "VAmPI-Context"
                urls:
                  - "http://localhost:5050"
          jobs:
            - type: openapi
              parameters:
                apiUrl: "http://localhost:5050/openapi.json"
            - type: passiveScan-config
            - type: activeScan
            - type: report
              parameters:
                template: "sarif"
                reportDir: "/zap/wrk"
                reportFile: "results"
          EOF

      # 3. Lanciamo ZAP direttamente tramite Docker.
      # Usiamo '--user root' per garantire che Docker abbia i permessi di scrivere il file sul server di GitHub
      - name: Esegui scansione OWASP ZAP (Automation Framework)
        run: |
          docker run --user root -v ${{ github.workspace }}:/zap/wrk/:rw -t zaproxy/zap-stable zap.sh -cmd -autorun /zap/wrk/vampi-zap.yaml

      # 4. Carichiamo i risultati SARIF aggiornando l'Action alla v4 (Risolve il warning del log!)
      - name: Upload dei risultati DAST su GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() # Esegui l'upload anche se vengono trovate vulnerabilità
        with:
          sarif_file: 'results.sarif'
          category: 'owasp-zap-dast'