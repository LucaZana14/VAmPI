name: Dynamic Security Testing

on: workflow_call

jobs:
  zap-scan:
    name: OWASP ZAP API Scan
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Accendiamo VAmPI all'interno del server GitHub
      - name: Build e Avvio di VAmPI
        run: |
          docker compose up --build -d
          sleep 15

      # 2. Inizializziamo il DB e generiamo un Token Dinamico sul momento
      - name: Setup DB e Auth Token
        id: auth
        run: |
          # 2a. Popola il database vuoto creando le tabelle necessarie
          curl -s http://localhost:5050/createdb > /dev/null
          
          # 2b. Registra un nuovo utente dedicato a ZAP
          curl -s -X POST "http://localhost:5050/users/v1/register" -H "Content-Type: application/json" -d '{"username": "zap_user", "password": "zap_password", "email": "zap@test.com"}' > /dev/null
          
          # 2c. Fai il login con l'utente appena creato ed estrai SOLO il token usando 'jq'
          TOKEN=$(curl -s -X POST "http://localhost:5050/users/v1/login" -H "Content-Type: application/json" -d '{"username": "zap_user", "password": "zap_password"}' | jq -r .auth_token)
          
          # 2d. Salva il token nelle variabili d'ambiente di GitHub in modo sicuro
          echo "API_TOKEN=$TOKEN" >> $GITHUB_ENV

      # 3. Creiamo al volo il file di configurazione ufficiale di ZAP (Automation Framework)
      - name: Creazione configurazione ZAP Automation
        run: |
          cat << 'EOF' > vampi-zap.yaml
          env:
            contexts:
              - name: VAmPI-Context
                urls:
                  - http://localhost:5050
          jobs:
            - type: replacer
              parameters:
                description: Iniezione Auth Token
                matchType: req_header_str
                matchString: Authorization
                # Inietta la variabile d'ambiente creata nello step precedente
                replacementString: Bearer ${{ env.API_TOKEN }}
            - type: openapi
              parameters:
                apiUrl: http://localhost:5050/openapi.json
            - type: passiveScan-config
            - type: activeScan
            - type: report
              parameters:
                template: sarif-json
                reportDir: /zap/wrk
                reportFile: results
          EOF

      # 4. Lanciamo ZAP direttamente tramite Docker.
      - name: Esegui scansione OWASP ZAP (Automation Framework)
        run: |
          docker run --user root -v ${{ github.workspace }}:/zap/wrk/:rw -t zaproxy/zap-stable zap.sh -cmd -autorun /zap/wrk/vampi-zap.yaml

      # 5. Carichiamo i risultati SARIF sulla Dashboard
      - name: Upload dei risultati DAST su GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.json
          category: owasp-zap-dast