name: Dynamic Security Testing

on: workflow_call

jobs:
  zap-scan:
    name: OWASP ZAP API Scan
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Accendiamo VAmPI all'interno del server GitHub
      - name: Build e Avvio di VAmPI
        run: |
          docker compose up --build -d
          sleep 15

      # 2. Inizializziamo il DB e generiamo un Token Dinamico sul momento
      - name: Setup DB e Auth Token
        id: auth
        run: |
          curl -s http://localhost:5050/createdb > /dev/null
          curl -s -X POST "http://localhost:5050/users/v1/register" -H "Content-Type: application/json" -d '{"username": "zap_user", "password": "zap_password", "email": "zap@test.com"}' > /dev/null
          TOKEN=$(curl -s -X POST "http://localhost:5050/users/v1/login" -H "Content-Type: application/json" -d '{"username": "zap_user", "password": "zap_password"}' | jq -r .auth_token)
          echo "API_TOKEN=$TOKEN" >> $GITHUB_ENV

      # 3. Creiamo al volo il file di configurazione ufficiale di ZAP
      - name: Creazione configurazione ZAP Automation
        run: |
          cat << 'EOF' > vampi-zap.yaml
          env:
            contexts:
              - name: VAmPI-Context
                urls:
                  - http://localhost:5050
          jobs:
            - type: replacer
              rules:
                - description: Iniezione Auth Token
                  matchType: req_header_str
                  matchString: Authorization
                  replacementString: Bearer ${{ env.API_TOKEN }}
            - type: openapi
              parameters:
                apiUrl: http://localhost:5050/openapi.json
            - type: passiveScan-config
            - type: activeScan
            - type: report
              parameters:
                template: sarif-json
                reportDir: /zap/wrk
                reportFile: results
          EOF

      # 4. Lanciamo ZAP direttamente tramite Docker.
      - name: Esegui scansione OWASP ZAP (Automation Framework)
        run: |
          docker run --user root --network host -v ${{ github.workspace }}:/zap/wrk/:rw -t zaproxy/zap-stable zap.sh -cmd -autorun /zap/wrk/vampi-zap.yaml

      # 5. TRADUTTORE SARIF: Inganniamo GitHub sostituendo gli URL con un file reale
      - name: Adatta il SARIF per GitHub Code Scanning
        if: always()
        run: |
          python3 -c "
          import json
          try:
              with open('results.json', 'r') as f:
                  data = json.load(f)
              for run in data.get('runs', []):
                  for result in run.get('results', []):
                      for location in result.get('locations', []):
                          pl = location.get('physicalLocation', {})
                          al = pl.get('artifactLocation', {})
                          # Se trova un URL di runtime, lo mappa al file openapi.json
                          if 'uri' in al and al['uri'].startswith('http'):
                              al['uri'] = 'openapi.json'
              with open('results.json', 'w') as f:
                  json.dump(data, f)
          except Exception as e:
              print(f'Nessun file da processare o errore: {e}')
          "

      # 6. Carichiamo i risultati SARIF (ora perfettamente compatibili)
      - name: Upload dei risultati DAST su GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.json
          category: owasp-zap-dast