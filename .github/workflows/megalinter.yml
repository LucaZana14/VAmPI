name: "Code Quality - MegaLinter"

on:
  workflow_call

permissions:
  contents: read
  security-events: write

jobs:
  megalinter:
    name: MegaLinter Scan
    runs-on: ubuntu-latest
    steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Esegui MegaLinter
        uses: oxsecurity/megalinter@v9
        continue-on-error: true
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_LINTERS: "PYTHON_RUFF,PYTHON_BANDIT"
          PYTHON_BANDIT_ARGUMENTS: "-s B105,B106,B107"
          SARIF_REPORTER: true

      - name: Debug — verifica file generati
        if: always()
        run: |
          echo "=== Contenuto megalinter-reports ==="
          ls -la megalinter-reports/ || echo "Directory non trovata"
          find . -name "*.sarif" 2>/dev/null || echo "Nessun file SARIF trovato"

      - name: Carica SARIF su GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: megalinter-reports/megalinter-report.sarif
          category: megalinter-quality