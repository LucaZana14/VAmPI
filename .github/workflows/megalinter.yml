name: "Code Quality - MegaLinter"

on:
  workflow_call

permissions:
  contents: read
  security-events: write

jobs:
  megalinter:
    name: MegaLinter Scan
    runs-on: ubuntu-latest
    steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2 
        with:
          egress-policy: audit

      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Esegui MegaLinter (Flavor Python)
        uses: oxsecurity/megalinter@v9  
        continue-on-error: true
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE LINTERS: "PYTHON_RUFF,PYTHON_BANDIT,DOCKERFILE_HADOLINT,YAML_YAMLLINT"
          SARIF_STATUS: "true"
          SARIF_OUTPUT_FILE: "megalinter-results.sarif"

      - name: Carica SARIF su GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() 
        with:
          sarif_file: "megalinter-reports/megalinter-results.sarif"
          category: "megalinter-quality"
          wait-for-processing: true