name: Trivy Docker+Image Scan + FileSystem

on:
  workflow_call

jobs:

  run-trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Build dell'immagine Docker
        run: docker build -t vampi-test:latest .

      - name: Esegui Trivy (IaC e Dockerfile)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Esegui Trivy (IaC e Dockerfile + image)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: 'vampi-test:latest'
          format: 'sarif'
          output: 'trivy-results-image.sarif'

      - name: Esegui Trivy (FileSystem)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results-fs.sarif'

      - name: Genera Software Bill of Materials (SBOM)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx' 
          output: 'bom.json' 

      - name: Carica SARIF su GitHub
        uses: github/codeql-action/upload-sarif@v4 
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-iac
          wait-for-processing: true

      - name: Carica SARIF image su GitHub
        uses: github/codeql-action/upload-sarif@v4 
        if: always()
        with:
          sarif_file: trivy-results-image.sarif
          category: trivy-container
          wait-for-processing: true
      - name: Carica SARIF filesystem su GitHub
        uses: github/codeql-action/upload-sarif@v4 
        if: always()
        with:
          sarif_file: trivy-results-fs.sarif
          category: trivy-fs
          wait-for-processing: true

      - name: Archivia la SBOM come Artefatto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vampi-sbom-cyclonedx
          path: bom.json
          retention-days: 14